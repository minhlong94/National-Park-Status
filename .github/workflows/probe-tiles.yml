name: Probe NPS map tiles (temporary)
on:
  push:
    branches: [claude/jolly-ptolemy-mtv1g5]
    paths: [.github/workflows/probe-tiles.yml, .github/probe/tiles.py]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Probe
        run: python3 -u .github/probe/tiles.py > .github/probe/out.txt 2>&1 || true
      - name: Save
        run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p .github/probe/out
          python3 - <<'PY'
          import base64, re
          for line in open('.github/probe/out.txt'):
              m = re.search(r'B64 (\w+) (\d+) (\S+)', line)
              if m: open(f'.github/probe/out/{m[1]}-{m[2]}.png', 'wb').write(base64.b64decode(m[3]))
          PY
          grep -v B64 .github/probe/out.txt > .github/probe/out/log.txt; rm .github/probe/out.txt
          git add .github/probe/out && git commit -qm "Probe output" && git push
