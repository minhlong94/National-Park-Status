name: Probe 2026 visit data (temporary)
on:
  push:
    branches: [claude/jolly-ptolemy-mtv1g5]
    paths: [.github/workflows/probe-visits.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Park page, data calls
        run: |
          set +e
          curl -sS -L --max-time 40 -A "Mozilla/5.0" -o /tmp/p.html "https://irma.nps.gov/Stats/Reports/Park/GRSM"
          echo "--- urls in page:"
          grep -o -E "[\"'](/Stats/[^\"' ]+|https://irma\.nps\.gov/Stats/[^\"' ]+)[\"']" /tmp/p.html | sort -u | head -60
          echo "--- url: / proxy / api fragments:"
          grep -o -i -E ".{0,80}(url:|proxy|api/|\.json|getData|Visitation)[^\n]{0,140}" /tmp/p.html | head -40
          echo "--- json keys with Month or Visit:"
          grep -o -E '"[A-Za-z]*(Month|Visit)[A-Za-z]*"' /tmp/p.html | sort | uniq -c | head -30
      - name: Report viewer CSV export
        run: |
          set +e
          J=/tmp/jar
          curl -sS -L --max-time 40 -A "Mozilla/5.0" -c $J -b $J -o /tmp/a.html "https://irma.nps.gov/Stats/SSRSReports/Park%20Specific%20Reports/Park%20YTD%20Version%201?Park=GRSM"
          SRC=$(grep -o 'src="[^"]*"' /tmp/a.html | head -1 | sed 's/^src="//; s/"$//; s/&amp;/\&/g')
          echo "iframe: $SRC"
          curl -sS -L --max-time 60 -A "Mozilla/5.0" -c $J -b $J -o /tmp/v.html "https://irma.nps.gov$SRC"
          echo "viewer size $(wc -c < /tmp/v.html)"
          grep -o -E '"ExportUrlBase":"[^"]*"' /tmp/v.html | head -3
          EXP=$(grep -o -E '"ExportUrlBase":"[^"]*"' /tmp/v.html | head -1 | sed 's/"ExportUrlBase":"//; s/"$//; s/\\u0026/\&/g')
          echo "export base: $EXP"
          if [ -n "$EXP" ]; then
            curl -sS -L --max-time 60 -A "Mozilla/5.0" -c $J -b $J -o /tmp/r.csv "https://irma.nps.gov$EXP""CSV"
            echo "csv size $(wc -c < /tmp/r.csv)"; head -c 3000 /tmp/r.csv; echo
          fi
          echo "--- 2026 in viewer:"; grep -o -E '.{0,100}2026.{0,100}' /tmp/v.html | head -10
