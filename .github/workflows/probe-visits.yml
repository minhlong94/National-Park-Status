name: Probe 2026 visit data (temporary)
on:
  push:
    branches: [claude/jolly-ptolemy-mtv1g5]
    paths: [.github/workflows/probe-visits.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Value format of RptDate
        run: |
          set +e
          for v in "9%2F1%2F2026" "202609" "2026-09" "Sep%202026" "09%2F01%2F2026" "2026-09-01T00%3A00%3A00" "9%2F1%2F2026%2012%3A00%3A00%20AM" "2" "20260901" "9%2F30%2F2026" "2026-09-30"; do
            J=$(mktemp)
            curl -sS -L --max-time 40 -A "Mozilla/5.0" -c $J -b $J -o /tmp/a.html "https://irma.nps.gov/Stats/SSRSReports/Park%20Specific%20Reports/Park%20YTD%20Version%201?Park=GRSM&RptDate=$v"
            SRC=$(grep -o 'src="[^"]*"' /tmp/a.html | head -1 | sed 's/^src="//; s/"$//; s/&amp;/\&/g')
            EFF=$(curl -sS -L --max-time 90 -A "Mozilla/5.0" -c $J -b $J -o /tmp/v.html -w '%{url_effective}' "https://irma.nps.gov$SRC")
            echo "== RptDate=$v  viewer $(wc -c < /tmp/v.html)  selected: $(grep -o -E 'selected="selected" value="[0-9]+">[A-Za-z]{3}&nbsp;[0-9]{4}' /tmp/v.html | head -1)"
            case "$EFF" in *error*) python3 -c "import sys,urllib.parse as u; q=u.parse_qs(u.urlparse(sys.argv[1]).query); print('   error:', q.get('errorType'), (q.get('error') or [''])[0][:400])" "$EFF";; esac
            EXP=$(grep -o -E '"ExportUrlBase":"[^"]*"' /tmp/v.html | head -1 | sed 's/"ExportUrlBase":"//; s/"$//; s/\\u0026/\&/g')
            [ -n "$EXP" ] && curl -sS -L --max-time 90 -A "Mozilla/5.0" -c $J -b $J "https://irma.nps.gov$EXP""CSV" | sed -n '2p;5p'
          done
