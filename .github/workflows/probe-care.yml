name: Probe Capitol Reef roads (temporary)
on:
  push:
    branches: [claude/jolly-ptolemy-mtv1g5]
    paths: [.github/workflows/probe-care.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - shell: python
        run: |
          import json, re, html, urllib.request
          UA = {"User-Agent": "Mozilla/5.0"}
          def page(u):
              try: s = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read().decode("utf-8", "ignore")
              except Exception as e: return None, str(e)
              i = s.find('id="main"'); t = s[i:] if i > 0 else s
              t = re.sub(r"<script.*?</script>|<style.*?</style>", "", t, flags=re.S)
              t = re.sub(r"</(p|li|tr|h\d|div)>|<br\s*/?>", "\n", t); t = re.sub(r"</t[dh]>", " | ", t)
              t = html.unescape(re.sub(r"<[^>]+>", " ", t)); t = re.sub(r"[ \t]+", " ", t); t = re.sub(r"\n\s*\n+", "\n", t)
              return s, t.split("Park footer")[0]
          for pg in ["planyourvisit/roadconditions.htm", "planyourvisit/road-conditions.htm", "planyourvisit/conditions.htm", "planyourvisit/backcountry-roads.htm", "planyourvisit/scenicdrive.htm"]:
              raw, t = page("https://www.nps.gov/care/" + pg)
              print(f"\n===== {pg}: {'NO PAGE ' + t if raw is None else len(raw)}")
              if raw:
                  print(t[:3500])
                  links = sorted(set(re.findall(r'(?:src|href|data-[a-z-]+)="([^"]*(?:\.json|\.csv|arcgis|sheets|airtable|embed)[^"]*)"', raw)))
                  if links: print("LINKS:", links[:15])
          j = json.load(urllib.request.urlopen("https://developer.nps.gov/api/v1/alerts?parkCode=care&api_key=DEMO_KEY", timeout=60))
          print("\n===== NPS alerts care")
          for a in j["data"]: print("-", a["category"], "|", a["title"], "|", (a.get("description") or "")[:160].replace("\n"," "))
