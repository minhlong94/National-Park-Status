name: Probe 64th park (temporary)
on:
  push:
    branches: [claude/jolly-ptolemy-mtv1g5]
    paths: [.github/workflows/probe-np64.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - shell: python
        run: |
          import json, urllib.request, urllib.parse, sys
          sys.path.insert(0, "scripts"); import fetch_history as fh
          H = {"User-Agent": "National-Park-Status (github.com/minhlong94)"}
          get = lambda u, h=H: json.load(urllib.request.urlopen(urllib.request.Request(u, headers=h), timeout=90))
          LAT, LON = 32.0091, -109.3892  # Chiricahua visitor center area
          def t(name, f):
              try: print("OK  ", name, "|", f())
              except Exception as e: print("FAIL", name, "|", repr(e)[:200])
          v = {}
          def visits():
              d = fh.fetch_visits(["CHIR"], "2023-01", "2026-09").get("CHIR", {})
              y25 = sum(x or 0 for k, x in d.items() if k.startswith("2025"))
              return f"{len(d)} months, first {min(d) if d else None}, last {max(k for k,x in d.items() if x is not None) if d else None}, 2025 total {y25}, 2026: {[ (k,x) for k,x in sorted(d.items()) if k.startswith('2026')]}"
          t("IRMA visits", visits)
          t("NPS park", lambda: [(p["fullName"], p["designation"], p["latitude"], p["longitude"]) for p in get("https://developer.nps.gov/api/v1/parks?parkCode=chir&api_key=DEMO_KEY")["data"]])
          t("NPS alerts", lambda: [a["title"] for a in get("https://developer.nps.gov/api/v1/alerts?parkCode=chir&api_key=DEMO_KEY")["data"]])
          t("NPS campgrounds", lambda: [(c["name"], [e.get("name") for oh in c.get("operatingHours", []) for e in oh.get("exceptions", [])][:3]) for c in get("https://developer.nps.gov/api/v1/campgrounds?parkCode=chir&api_key=DEMO_KEY")["data"]])
          t("NPS visitor centers", lambda: [c["name"] for c in get("https://developer.nps.gov/api/v1/visitorcenters?parkCode=chir&api_key=DEMO_KEY")["data"]])
          q = urllib.parse.urlencode({"where": "UNIT_CODE='CHIR'", "outFields": "UNIT_CODE,UNIT_NAME,UNIT_TYPE", "returnGeometry": "false", "f": "json"})
          t("NPS boundary", lambda: [f["attributes"] for f in get("https://services1.arcgis.com/fBc8EJBxQRMcHlei/arcgis/rest/services/NPS_Land_Resources_Division_Boundary_and_Tract_Data_Service/FeatureServer/2/query?" + q)["features"]])
          t("NWS point", lambda: get(f"https://api.weather.gov/points/{LAT},{LON}", {**H, "Accept": "application/geo+json"})["properties"]["forecastZone"])
          t("MODIS MCD12Q2", lambda: str(get(f"https://modis.ornl.gov/rst/api/v1/MCD12Q2/dates?latitude={LAT}&longitude={LON}", {**H, "Accept": "application/json"}))[:200])
          t("Open-Meteo archive", lambda: len(get(f"https://archive-api.open-meteo.com/v1/archive?latitude={LAT}&longitude={LON}&start_date=2025-01-01&end_date=2025-01-31&daily=temperature_2m_max")["daily"]["time"]))
