name: Probe seasonal road pages (temporary)
on:
  push:
    branches: [claude/jolly-ptolemy-mtv1g5]
    paths: [.github/workflows/probe-roads2.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - shell: python
        run: |
          import re, html, urllib.request
          UA = {"User-Agent": "Mozilla/5.0"}
          def text(u):
              try:
                  s = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read().decode("utf-8", "ignore")
              except Exception as e:
                  return None
              i = s.find('id="main"'); s = s[i:] if i > 0 else s
              s = re.sub(r"<script.*?</script>|<style.*?</style>", "", s, flags=re.S)
              s = re.sub(r"</(p|li|tr|h\d|div)>", "\n", s); s = re.sub(r"</t[dh]>", " | ", s)
              s = html.unescape(re.sub(r"<[^>]+>", " ", s)); s = re.sub(r"[ \t]+", " ", s)
              s = re.sub(r"\n\s*\n+", "\n", s)
              return s.split("Park footer")[0]
          t = text("https://www.nps.gov/yell/planyourvisit/parkroads.htm")
          i = t.find("2026 Road Opening")
          print("=== YELL ===\n", t[i:i+4500] if i >= 0 else t[:4500])
          MON = r"(January|February|March|April|May|June|July|August|September|October|November|December|Jan|Feb|Mar|Apr|Jun|Jul|Aug|Sep|Sept|Oct|Nov|Dec)\.? \d"
          pages = {"grte":["hours.htm"], "romo":["trail-ridge-road.htm","hours.htm"], "lavo":["hours.htm","road-status.htm"], "crla":["hours.htm"],
                   "mora":["hours.htm","road-status.htm"], "noca":["hours.htm"], "olym":["hours.htm","hurricane-ridge.htm"], "grca":["hours.htm","north-rim.htm"],
                   "dena":["hours.htm","road-status.htm"], "seki":["hours.htm","conditions.htm"], "grba":["hours.htm"], "glac":["hours.htm"], "brca":["hours.htm"], "zion":["hours.htm"], "yose":["hours.htm"]}
          for code, ps in pages.items():
              for pg in ps:
                  t = text(f"https://www.nps.gov/{code}/planyourvisit/{pg}")
                  if not t: print(f"\n=== {code} {pg}: no page"); continue
                  lines = [l.strip() for l in t.split("\n") if re.search(MON, l) and re.search(r"(?i)road|drive|highway|hwy|route|pass|rim", l)]
                  print(f"\n=== {code} {pg}: {len(lines)} lines")
                  for l in lines[:25]: print("  -", l[:300])
