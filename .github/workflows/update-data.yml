name: Update park history data

# Gets monthly visits (NPS) and monthly climate (Open-Meteo) for each park,
# then commits data/park-history.js to the branch that started the run.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_history.py
      - .github/workflows/update-data.yml
  schedule:
    - cron: "17 6 3 * *"  # 06:17 UTC on day 3 of each month

permissions:
  contents: write

concurrency:
  group: update-data-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Get the data
        run: python3 scripts/fetch_history.py
      - name: Commit the data if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/park-history.js
          if git diff --cached --quiet; then
            echo "No change in the data."
          else
            git commit -m "Update park history data"
            git push
          fi
