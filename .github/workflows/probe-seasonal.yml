name: Probe seasonal pages (temporary)
on:
  push:
    branches: [claude/jolly-ptolemy-mtv1g5]
    paths: [.github/workflows/probe-seasonal.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Yosemite dataset links
        shell: python
        run: |
          import re, urllib.request
          UA={"User-Agent":"Mozilla/5.0"}
          s = urllib.request.urlopen(urllib.request.Request("https://www.nps.gov/yose/planyourvisit/seasonal.htm", headers=UA), timeout=30).read().decode("utf-8","ignore")
          links = sorted(set(re.findall(r'(?:href|src|data-[a-z-]+)="([^"]+\.(?:csv|json|xlsx?|js)[^"]*)"', s)))
          print("\n".join(l for l in links if "common" not in l))
          for m in re.finditer(r'Download This Dataset', s):
              print("CTX:", re.sub(r'\s+',' ', s[max(0,m.start()-600):m.start()+100]))
          for u in [l for l in links if l.endswith(".csv") or ".csv?" in l][:6]:
              if u.startswith("/"): u = "https://www.nps.gov" + u
              d = urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=30).read().decode("utf-8","ignore")
              print("\n=== ", u, len(d)); print(d[:1500])
      - name: NPS API seasonal exceptions, all parks
        shell: python
        run: |
          import json, urllib.request, collections, datetime as dt
          codes = "acad,arch,badl,bibe,bisc,blca,brca,cany,care,cave,chis,cong,crla,cuva,deva,dena,drto,ever,gaar,glac,glba,grba,grca,grsa,grsm,grte,gumo,hale,havo,hosp,indu,isro,jeff,jotr,katm,kefj,kova,lacl,lavo,maca,meve,mora,neri,noca,npsa,olym,pefo,pinn,redw,romo,sagu,seki,shen,thro,viis,voya,whsa,wica,wrst,yell,yose,zion"
          today = dt.date.today().isoformat()
          for ep in ["campgrounds", "visitorcenters"]:
              allp, start = [], 0
              while True:
                  j = json.load(urllib.request.urlopen(f"https://developer.nps.gov/api/v1/{ep}?parkCode={codes}&limit=500&start={start}&api_key=DEMO_KEY", timeout=90))
                  allp += j["data"]; start += len(j["data"])
                  if not j["data"] or start >= int(j["total"]): break
              per = collections.Counter(); withex = collections.Counter()
              names = collections.Counter()
              for d in allp:
                  per[d["parkCode"]] += 1
                  ex = [e for oh in d.get("operatingHours", []) for e in oh.get("exceptions", [])
                        if e.get("endDate", "") >= today and all(v == "Closed" for v in (e.get("exceptionHours") or {}).values())]
                  if ex: withex[d["parkCode"]] += 1
                  for e in ex: names[e.get("name","")] += 1
              print(f"\n== {ep}: {len(allp)} items, parks {len(per)}, items with a future closed exception: {sum(withex.values())} in {len(withex)} parks")
              print("parks with:", dict(withex))
              print("common names:", names.most_common(15))
