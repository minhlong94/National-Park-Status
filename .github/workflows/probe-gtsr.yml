name: Probe Going-to-the-Sun status (temporary)
on:
  push:
    branches: [claude/jolly-ptolemy-mtv1g5]
    paths: [.github/workflows/probe-gtsr.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - shell: python
        run: |
          import json, re, urllib.request, urllib.parse
          UA = {"User-Agent": "Mozilla/5.0"}
          get = lambda u: urllib.request.urlopen(urllib.request.Request(u, headers=UA), timeout=40).read().decode("utf-8", "ignore")
          cfg = get("https://www.nps.gov/maps/builder/configs/3169c295-ee4c-4d7f-b311-bcbd38474f82.json")
          c = json.loads(cfg)
          for o in c.get("overlays", []):
              print("OVERLAY:", o.get("name"), "|", json.dumps(o.get("popup"))[:300])
              print("   url:", (o.get("url") or "")[:400])
          SQL = "https://carto.nps.gov/user/glaclive/api/v2/sql?q="
          q = lambda s: json.loads(get(SQL + urllib.parse.quote(s)))
          print("\nOUR QUERY rows:")
          for r in q("SELECT rdname, status, reason, seasdesc FROM glac_road_nds WHERE status IN ('closed','construction')")["rows"]:
              print("  ", r)
          print("\nSUN rows in glac_road_nds:")
          for r in q("SELECT rdname, status, reason FROM glac_road_nds WHERE rdname ILIKE '%sun%'")["rows"]:
              print("  ", r)
          print("\nstatus values:", q("SELECT status, count(*) FROM glac_road_nds GROUP BY status")["rows"])
